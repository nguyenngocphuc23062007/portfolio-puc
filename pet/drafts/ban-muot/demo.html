<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cáo thử nghiệm</title>
<style>
  :root { --bg:#f6f3ee; --ink:#1d1b1a; --muted:#6b645f; --line:#d9d2c8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1c1b; --ink:#f1ece6; --muted:#a59d96; --line:#3a3634; } }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:720px; padding:32px 16px 260px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 16px; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  button:focus-visible { outline:2px solid #F38C1D; outline-offset:2px; }
  .ground { position:fixed; left:0; right:0; bottom:0; height:24px; border-top:2px solid var(--line); }
  .fox, .fx { position:fixed; left:0; top:0; image-rendering:pixelated; background-repeat:no-repeat; pointer-events:none; }
  .fox { pointer-events:auto; cursor:grab; touch-action:none; z-index:5; }
  .fox.drag { cursor:grabbing; }
  .fx { z-index:6; }
  .state { font:12px ui-monospace, monospace; color:var(--muted); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Cáo thử nghiệm</h1>
  <p>Rê chuột để cáo đi theo, bấm vào cáo để nó nhảy, xoa qua lại trên cáo để nó vui, kéo cáo lên rồi thả. Để yên một lúc thì cáo nằm ngủ.</p>
  <p>Bấm từng nút để xem riêng mỗi động tác:</p>
  <div class="btns" id="btns"></div>
  <div class="state" id="state"></div>
</main>
<div class="ground"></div>
<div class="fox" id="fox" role="img" aria-label="Con cáo pixel"></div>

const FXA = { zzz:[0,3,3], heart:[1,3,6], bang:[2,2,8], dust:[3,4,10], shake:[4,2,6], stars:[5,4,8], shadow:[6,2,1] };
const VI = { idle:'Ngồi nghỉ', lie:'Nằm', sleep:'Ngủ', sleepy:'Nằm lim dim', dash:'Chạy', startle:'Giật mình',
  crouch:'Lấy đà', leap:'Nhảy', land:'Đáp đất', happy:'Vui', liedown:'Nằm xuống', wake:'Thức dậy', wiggle:'Nhún vẫy đuôi',
  held:'Bị nhấc', dizzy:'Choáng', peek:'Ló ra', lookup:'Nhìn lên', tilt:'Nghiêng đầu', curl:'Ngủ cuộn tròn',
  dig:'Đào đất', eat:'Ăn', sniff:'Ngửi', sad:'Dỗi' };

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = document.getElementById('fox'), stateEl = document.getElementById('state');
el.style.width = FW*SCALE+'px'; el.style.height = FH*SCALE+'px';
el.style.backgroundImage = `url(${SHEET})`;
el.style.transformOrigin = `${ANCHOR*SCALE}px 0`;
el.style.backgroundSize = `${FW*6*SCALE}px ${FH*23*SCALE}px`;

const fox = { x: innerWidth/2, y: 0, vx: 0, vy: 0, face: -1, anim:'peek', t:0, frame:0, done:false, queue:[], mode:'auto', lastAct: performance.now() };
const groundY = () => innerHeight - 24 - 2;           // đường đất, tính bằng px
const mouse = { x: innerWidth/2, y: innerHeight/2, moved: 0, inside:false };

function play(name, then){ fox.anim = name; fox.t = 0; fox.frame = 0; fox.done = false; fox.queue = then ? [].concat(then) : []; }
function next(){ const n = fox.queue.shift(); if (n) play(n, fox.queue); else play('idle'); }

// Hiệu ứng rời
const fxs = [];
function fx(name, dx, dy, life){
  const d = document.createElement('div'); d.className = 'fx';
  d.style.width = d.style.height = FX*SCALE+'px';
  d.style.backgroundImage = `url(${FXSHEET})`;
  d.style.backgroundSize = `${FX*4*SCALE}px ${FX*7*SCALE}px`;
  document.body.appendChild(d);
  fxs.push({ d, name, dx, dy, t:0, life: life || 1.2 });
}

function render(){
  const [row, n, , loop] = A[fox.anim];
  const f = loop === 2 && fox.frame >= n ? 2*n - 2 - fox.frame : fox.frame;
  el.style.backgroundPosition = `${-f*FW*SCALE}px ${-row*FH*SCALE}px`;
  const left = fox.x - ANCHOR*SCALE, top = groundY() - GROUND_ROW*SCALE - fox.y;
  el.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px) scaleX(${fox.face < 0 ? 1 : -1})`;
  stateEl.textContent = `Đang: ${VI[fox.anim]}`;
  for (const b of document.querySelectorAll('#btns button')) b.setAttribute('aria-pressed', b.dataset.a === fox.anim);
}

// Nút xem từng động tác
const btns = document.getElementById('btns');
for (const k in A){
  const b = document.createElement('button'); b.textContent = VI[k]; b.dataset.a = k;
  b.onclick = () => { fox.mode = 'manual'; play(k); fox.lastAct = performance.now(); };
  btns.appendChild(b);
}
const auto = document.createElement('button'); auto.textContent = 'Tự do'; auto.onclick = () => { fox.mode = 'auto'; play('idle'); };
btns.appendChild(auto);

// Chuột
addEventListener('pointermove', e => {
  const dx = e.clientX - mouse.x; mouse.x = e.clientX; mouse.y = e.clientY;
  mouse.moved = performance.now();
  if (drag.on){ drag.vx = dx; fox.x = e.clientX; fox.y = Math.max(0, groundY() - e.clientY - 10); return; }
  // xoa: đưa chuột qua lại trên người cáo
  const r = el.getBoundingClientRect();
  if (fox.mode === 'auto' && e.clientX > r.left && e.clientX < r.right && e.clientY > r.top + r.height*0.4 && e.clientY < r.bottom){
    pet.amount += Math.abs(dx);
    if (pet.amount > 400 && !['happy','held','leap','crouch','land'].includes(fox.anim)){ pet.amount = 0; play('happy'); fx('heart', 0, 34, 1.4); setTimeout(() => fox.anim === 'happy' && play('idle'), 2000); fox.lastAct = performance.now(); }
  }
});
const pet = { amount: 0 };
setInterval(() => pet.amount *= 0.5, 500);

const drag = { on:false, vx:0, downAt:0, sx:0, sy:0, moved:false };
el.addEventListener('pointerdown', e => {
  e.preventDefault(); el.setPointerCapture(e.pointerId);
  drag.downAt = performance.now(); drag.sx = e.clientX; drag.sy = e.clientY; drag.moved = false; drag.pending = true;
});
addEventListener('pointermove', e => {
  if (drag.pending && !drag.on && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8){
    drag.on = true; drag.pending = false; el.classList.add('drag'); fox.mode = 'auto'; play('held');
  }
});
addEventListener('pointerup', () => {
  if (drag.on){
    drag.on = false; el.classList.remove('drag');
    fox.vy = 0; fox.fallFrom = fox.y; fox.throwVx = drag.vx;
    play('held'); fox.falling = true;
  } else if (drag.pending){
    drag.pending = false; fox.mode = 'auto';
    play('startle', ['crouch','leap','land','idle']); fx('bang', -8, 44, 0.6); fox.lastAct = performance.now();
  }
});

// Vòng lặp
let last = performance.now();
function tick(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  const [row, n, fps, loop] = A[fox.anim];
  // khi chạy, nhịp chân theo tốc độ để chân không trượt trên đất
  const speedUp = fox.anim === 'dash' ? Math.max(0.45, Math.min(1.1, Math.abs(fox.vx)/280)) : 1;
  const total = loop === 2 ? Math.max(1, 2*n - 2) : n;
  fox.t += dt * fps * speedUp;
  while (fox.t >= 1){ fox.t -= 1; fox.frame++; if (fox.frame >= total){ if (loop) fox.frame = 0; else { fox.frame = n-1; fox.done = true; } } }

  if (fox.falling){
    fox.vy -= 2200*dt; fox.y += fox.vy*dt; fox.x += (fox.throwVx||0)*dt*30;
    if (fox.y <= 0){
      fox.y = 0; fox.falling = false;
      if (fox.fallFrom > 220 || Math.abs(fox.throwVx) > 25){ play('dizzy'); fx('stars', 0, 30, 2.2); setTimeout(() => fox.anim === 'dizzy' && play('wake'), 2200); }
      else { play('land'); fx('dust', 0, 6, 0.5); }
    }
  } else if (!drag.on && fox.mode === 'auto' && !reduce) think(now, dt);
  else if (fox.done && fox.mode === 'manual') { /* giữ khung cuối */ }

  if (fox.done && fox.mode === 'auto' && !fox.falling) next();
  fox.x = Math.max(16*SCALE, Math.min(innerWidth - 16*SCALE, fox.x));

  for (let i = fxs.length - 1; i >= 0; i--){
    const f = fxs[i]; f.t += dt; const [r, c, fp] = FXA[f.name];
    const fr = Math.min(c-1, Math.floor(f.t*fp) % c);
    f.d.style.backgroundPosition = `${-fr*FX*SCALE}px ${-r*FX*SCALE}px`;
    const x = fox.x + f.dx*SCALE*-fox.face*-1 - FX*SCALE/2, y = groundY() - fox.y - f.dy*SCALE - FX*SCALE/2 - (f.name==='zzz'||f.name==='heart' ? f.t*30 : 0);
    f.d.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
    f.d.style.opacity = f.t > f.life - 0.3 ? Math.max(0, (f.life - f.t)/0.3) : 1;
    if (f.t >= f.life){ f.d.remove(); fxs.splice(i, 1); }
  }
  render();
  requestAnimationFrame(tick);
}

const BUSY = ['startle','crouch','leap','land','happy','liedown','wake','held','dizzy','peek'];
let nextIdleTrick = performance.now() + 5000, zzzAt = 0;
function think(now, dt){
  const dx = mouse.x - fox.x, dist = Math.abs(dx);
  const mouseFresh = now - mouse.moved < 1500;
  const asleep = ['liedown','sleep','lie','curl','sleepy'].includes(fox.anim);

  if (fox.anim === 'leap'){ fox.x += fox.face * 240 * (1 - fox.frame/4) * dt; fox.vx = 0; return; }
  if (BUSY.includes(fox.anim)) fox.vx = 0;
  if (BUSY.includes(fox.anim)) return;

  if (asleep){
    if (fox.anim === 'sleep' && now > zzzAt){ fx('zzz', -10, 32, 2); zzzAt = now + 2200; }
    if (mouseFresh && dist < 160){ play('wake', 'idle'); fox.lastAct = now; }
    return;
  }

  // Đi theo chuột: tăng tốc và hãm dần, có khoảng đệm để cáo không giật đi giật dừng
  const moving = fox.anim === 'dash';
  let target = 0;
  if (mouseFresh && dist > (moving ? 24 : 70)) target = Math.sign(dx) * (dist < 260 ? 120 : 300);
  fox.vx += (target - fox.vx) * Math.min(1, dt * (target ? 5 : 8));
  if (target){
    if (Math.sign(target) !== Math.sign(fox.vx) && Math.abs(fox.vx) > 40) {} // đang hãm để quay đầu
    else fox.face = Math.sign(target);
    if (!moving) play('dash');
    fox.lastAct = now;
  }
  fox.x += fox.vx * dt;
  if (moving){ if (!target && Math.abs(fox.vx) < 25){ fox.vx = 0; play('idle'); } else return; }

  // con trỏ ngay trên đầu
  if (mouseFresh && dist <= 40 && mouse.y < groundY() - 200 && fox.anim === 'idle'){ play('lookup', 'idle'); return; }
  // con trỏ đứng yên gần cáo: nhún mông rồi vồ
  if (!mouseFresh && now - mouse.moved < 4000 && dist < 120 && mouse.y > groundY() - 160 && fox.anim === 'idle' && Math.random() < dt*0.6){
    fox.face = dx < 0 ? -1 : 1; play('wiggle'); setTimeout(() => fox.anim === 'wiggle' && play('leap', ['land','idle']), 1100); return;
  }
  // để yên lâu thì đi ngủ
  if (now - fox.lastAct > 12000 && fox.anim === 'idle'){ play('liedown', 'sleep'); return; }
  // vài trò vặt khi ngồi không
  if (fox.anim === 'idle' && now > nextIdleTrick){
    const t = ['tilt','sniff','eat','dig','lookup'][Math.floor(Math.random()*5)];
    play(t, 'idle'); fox.trickEnd = now + (A[t][3] ? 2500 : 0);
    nextIdleTrick = now + 6000 + Math.random()*6000;
  }
  if (['sniff','eat','dig'].includes(fox.anim) && now > fox.trickEnd) play('idle');
}

addEventListener('resize', render);
play(reduce ? 'idle' : 'peek', 'idle');
render(); requestAnimationFrame(tick);
</script>
</body>
</html>
